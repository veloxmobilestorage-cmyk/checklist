<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Velox Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #00D8B8; --teal-ink: #00715F; --teal-wash: #E3F8F4;
  --slate: #202C33; --slate-2: #3A4A54; --muted: #5E6E77;
  --bg: #F3F6F5; --row: #FFFFFF; --line: #DCE3E1;
  --amber: #9A6A12; --amber-wash: #FBF3E2;
  --red: #A33A2B; --red-wash: #FBEAE7;
  --rail-lead: #00D8B8; --rail-quote: #5B7C99; --rail-review: #D6A21E;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--slate); font: 400 16px/1.5 "Barlow", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

/* Header: the dispatch board */
header.board { position: sticky; top: 0; z-index: 5; background: var(--slate); color: #fff; padding: 14px 16px 0; }
.board-inner { max-width: 720px; margin: 0 auto; }
.board-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.count { font-family: "Barlow Condensed", sans-serif; font-weight: 700; line-height: .9; font-size: 64px; letter-spacing: -.5px; }
.count small { display: block; font-weight: 500; font-size: 18px; letter-spacing: 0; color: #B8C6CC; margin-top: 4px; }
.who { text-align: right; font-size: 14px; color: #B8C6CC; }
.who select { background: transparent; border: 1px solid #4A5B65; color: #fff; border-radius: 6px; padding: 4px 6px; margin-top: 4px; font-size: 15px; }
.who select option { color: var(--slate); }
nav.tabs { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { flex: 0 0 auto; background: none; border: 0; color: #B8C6CC; cursor: pointer; padding: 10px 12px 12px; font-family: "Barlow Condensed", sans-serif; font-size: 19px; font-weight: 600; border-bottom: 4px solid transparent; }
nav.tabs button[aria-selected="true"] { color: #fff; border-bottom-color: var(--teal); }
nav.tabs .n { font-weight: 500; color: #8FA3AC; margin-left: 4px; }

main { max-width: 720px; margin: 0 auto; padding: 16px 16px 80px; }
.empty { padding: 48px 8px; color: var(--muted); }
.empty strong { display: block; font-family: "Barlow Condensed", sans-serif; font-size: 26px; color: var(--slate); font-weight: 600; }

/* A row in the list */
article.item { background: var(--row); border: 1px solid var(--line); border-left: 6px solid var(--rail-quote); border-radius: var(--radius); padding: 14px 16px 16px; margin-bottom: 14px; }
article.item.k-new_lead { border-left-color: var(--rail-lead); }
article.item.k-review_ask, article.item.k-review_links { border-left-color: var(--rail-review); }
.kind { font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.kind .when { white-space: nowrap; }
h2.title { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15; margin: 2px 0 8px; }
ul.facts { list-style: none; margin: 0 0 12px; padding: 0; font-size: 15px; color: var(--slate-2); }
ul.facts li { padding: 2px 0; }
ul.facts li.warn { color: var(--amber); background: var(--amber-wash); padding: 6px 10px; border-radius: 6px; margin: 4px 0; }
.err { color: var(--red); background: var(--red-wash); padding: 8px 10px; border-radius: 6px; font-size: 15px; margin-bottom: 10px; }
.from { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
textarea { width: 100%; min-height: 90px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; line-height: 1.45; background: #FBFCFC; resize: vertical; }
.chars { font-size: 13px; color: var(--muted); text-align: right; margin-top: 2px; }

.price { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 4px 0 10px; }
.price label { font-size: 14px; color: var(--muted); display: block; }
.price input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #FBFCFC; font-variant-numeric: tabular-nums; }
.toggles { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 15px; }
.toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--teal-ink); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--slate-2); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--slate); font-weight: 600; }
.btn.primary:hover { filter: brightness(.95); }
.btn.quiet { border-color: transparent; color: var(--muted); padding-left: 6px; padding-right: 6px; }
.btn:disabled { opacity: .55; cursor: progress; }
.spacer { flex: 1; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; bottom: calc(100% + 6px); background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgba(32,44,51,.14); padding: 6px; min-width: 210px; z-index: 3; }
.menu-list button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu-list button:hover { background: var(--bg); }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--slate); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 15px; z-index: 10; max-width: calc(100% - 32px); }

/* Sign-in */
.signin { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; }
.signin h1 { font-family: "Barlow Condensed", sans-serif; font-size: 44px; line-height: 1; margin: 0 0 8px; }
.signin p { color: var(--muted); margin: 0 0 20px; }
.signin input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fff; }
.signin .btn { width: 100%; padding: 12px; }
.mark { display: inline-block; width: 44px; height: 8px; background: var(--teal); border-radius: 2px; margin-bottom: 18px; }

@media (max-width: 480px) {
  .count { font-size: 52px; }
  .price { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  h2.title { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  article.item.leaving { transition: opacity .25s, transform .25s; opacity: 0; transform: translateX(16px); }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// Hosted page: talks to the assistant directly. Nothing secret lives here; every call carries the person's PIN.
const API = "https://cnhgxklsgoczxxbymzcd.supabase.co/functions/v1/velox";
const gs = async (fn, ...args) => {
  const route = { getCards: "pin/list", doAction: "pin/act", checkPin: "pin/check" }[fn];
  const payload = fn === "doAction" ? { pin: args[1], body: args[0] } : { pin: args[0] };
  let res;
  try {
    res = await fetch(API + "/" + route, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
  } catch (e) {
    throw new Error("No connection. Check your signal and try again.");
  }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ("Error " + res.status));
  return fn === "checkPin" ? j.name : j;
};
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const app = document.getElementById("app");

const KIND = {
  new_lead: "New lead", quote_text: "Quote sent", follow_up_1: "Follow-up, day 1", follow_up_3: "Follow-up, day 3",
  follow_up_7: "Follow-up, day 7", review_ask: "Review request", review_links: "Review links",
};
const FROM = { "+18013629978": "Velox Utah (801) 362-9978", "+17206748777": "Velox Denver (720) 674-8777" };
const WARN = /by hand|Check the|Couldn't|Confirm|isn't on|not recognized|Outside|Add the yard/i;

let state = { tab: "todo", cards: [], user: store.get("velox-actor") || "Katie", openMenu: null, status: {} };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtWhen = (iso) => {
  const d = new Date(iso), now = new Date();
  const same = d.toDateString() === now.toDateString();
  const t = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  return same ? `today ${t}` : d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) + ` ${t}`;
};

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

// ---------- start ----------
function boot() {
  render();
  load();
  setInterval(() => { if (!document.querySelector("textarea:focus, input:focus")) load(); }, 60000);
}

// ---------- data ----------
async function load() {
  try {
    const r = await gs("getCards", pin_());
    state.cards = r.cards || [];
    state.status = { stella: r.stella_connected, quo: r.quo_connected };
    if (r.me) { state.user = r.me; }
  } catch (e) {
    if (/PIN/.test(String(e.message || e))) { try { localStorage.removeItem("velox-pin"); } catch (_) {} return signin(String(e.message || e)); }
    app.innerHTML = `<main><div class="err">Couldn't load the list: ${esc(e.message || e)}. Refresh the page; if it keeps happening, tell Trent.</div></main>`;
    return;
  }
  render();
}

function buckets() {
  const now = Date.now();
  const b = { todo: [], waiting: [], later: [], done: [] };
  for (const c of state.cards) {
    const due = new Date(c.due_at).getTime() <= now;
    if (c.status === "failed") b.todo.push(c);
    else if (c.status === "open") (due ? b.todo : b.later).push(c);
    else if (c.status === "waiting") b.waiting.push(c);
    else if (c.status === "scheduled") b.later.push(c);
    else b.done.push(c);
  }
  b.done.sort((a, c) => new Date(c.acted_at) - new Date(a.acted_at));
  return b;
}

// ---------- render ----------
function render() {
  const b = buckets();
  const tabs = [["todo", "To do"], ["waiting", "Waiting on customer"], ["later", "Later"], ["done", "Done today"]];
  const list = b[state.tab];
  app.innerHTML = `
  <header class="board">
    <div class="board-inner">
      <div class="board-top">
        <div class="count" aria-live="polite">${b.todo.length}<small>${b.todo.length === 1 ? "thing to check" : "things to check"}</small></div>
        <div class="who"><label for="actor">Working as</label><br><select id="actor">${["Katie", "Trent"].map((n) => `<option ${n === state.user ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      </div>
      <nav class="tabs" role="tablist">
        ${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}<span class="n">${b[k].length}</span></button>`).join("")}
      </nav>
    </div>
  </header>
  <main>${setupNotice()}${list.length ? list.map(cardHtml).join("") : emptyHtml()}</main>`;
  app.querySelectorAll("[data-tab]").forEach((el) => el.onclick = () => { state.tab = el.dataset.tab; render(); });
  document.getElementById("actor").onchange = (e) => { state.user = e.target.value; store.set("velox-actor", state.user); };
  wire();
}

function setupNotice() {
  const miss = [];
  if (state.status.quo === false) miss.push("Texts can't send yet: Quo isn't connected. Copy the text into Quo for now.");
  if (state.status.stella === false) miss.push("Stella isn't connected yet: create quotes in Stella by hand using the prices on each card.");
  return miss.map((m) => `<div class="err" style="color:var(--amber);background:var(--amber-wash)">${esc(m)}</div>`).join("");
}

function emptyHtml() {
  const m = {
    todo: ["All caught up.", "New leads, quote texts, follow-ups and review requests show up here as they come in."],
    waiting: ["Nothing waiting.", "Quotes sent to Stella and review links you're holding show up here."],
    later: ["Nothing scheduled.", "Snoozed items and texts set to go out at 8 am show up here."],
    done: ["Nothing done yet today.", "Everything you send or skip today is listed here."],
  }[state.tab];
  return `<div class="empty"><strong>${m[0]}</strong>${m[1]}</div>`;
}

function cardHtml(c) {
  const facts = (c.context || []).map((l) => `<li class="${WARN.test(l) ? "warn" : ""}">${esc(l)}</li>`).join("");
  const kind = KIND[c.type] || c.type;
  const when = c.status === "scheduled" ? `goes out ${fmtWhen(c.due_at)}`
    : ["sent", "done", "skipped"].includes(c.status) ? `${c.status} ${fmtWhen(c.acted_at)}${c.acted_by ? " by " + esc(c.acted_by) : ""}`
    : new Date(c.due_at) > new Date() ? `shows ${fmtWhen(c.due_at)}` : fmtWhen(c.created_at);
  const err = c.error && c.status === "failed" ? `<div class="err">${esc(c.error)}</div>` : "";
  const finished = ["sent", "done", "skipped", "cancelled"].includes(c.status);
  let body = "";
  if (c.type === "new_lead") body = leadBody(c, finished);
  else if (c.channel === "text") body = textBody(c, finished);
  return `
  <article class="item k-${c.type}" data-id="${c.id}">
    <div class="kind"><span>${esc(kind)}</span><span class="when">${when}</span></div>
    <h2 class="title">${esc(c.title)}</h2>
    ${err}
    <ul class="facts">${facts}</ul>
    ${body}
  </article>`;
}

function textBody(c, finished) {
  const from = FROM[c.from_number] || c.from_number || "";
  if (finished) return `<div class="from">${c.status === "sent" ? "Sent" : "Draft"} from ${esc(from)}</div><p style="margin:0;color:var(--slate-2)">${esc(c.draft)}</p>`;
  const sendLabel = c.type === "review_links" ? "Send links" : "Send text";
  return `
    <div class="from"><label for="d-${c.id}">Text to ${esc(prettyPhone(c.to_phone))} from ${esc(from)}</label></div>
    <textarea id="d-${c.id}" data-draft>${esc(c.draft)}</textarea>
    <div class="chars" data-chars>${(c.draft || "").length} characters</div>
    <div class="actions">
      <button class="btn primary" data-act="approve">${sendLabel}</button>
      ${laterMenu(c)}
      <span class="spacer"></span>
      <button class="btn quiet" data-act="skip">Skip</button>
    </div>`;
}

function leadBody(c, finished) {
  const q = c.payload?.quote || {};
  if (finished) return "";
  if (c.status === "waiting") return `
    <div class="actions">
      <span class="from">The quote is in Stella under Action Required. Open it, pick the Sales Tax Jurisdiction${q.place ? ` (${esc(q.place.split(",")[0])})` : ""}, Save, then Send quote. This clears on its own when Stella emails it.</span>
      <span class="spacer"></span><button class="btn quiet" data-act="done">Mark done</button>
    </div>`;
  return `
    <div class="price">
      <div><label for="r-${c.id}">Rent / month</label><input id="r-${c.id}" inputmode="decimal" data-f="rent" value="${q.rent ?? ""}"></div>
      <div><label for="dl-${c.id}">Delivery</label><input id="dl-${c.id}" inputmode="decimal" data-f="delivery" value="${q.delivery ?? ""}"></div>
      <div><label for="pu-${c.id}">Pickup</label><input id="pu-${c.id}" inputmode="decimal" data-f="pickup" value="${q.pickup ?? ""}"></div>
    </div>
    <div class="price">
      <div><label for="dt-${c.id}">Delivery date</label><input id="dt-${c.id}" type="date" data-f="start_date" value="${tomorrowISO()}"></div>
      ${c.payload?.stella?.email ? "" : `<div style="grid-column: span 2"><label for="em-${c.id}">Email (Stella needs one)</label><input id="em-${c.id}" type="email" data-f="email" value=""></div>`}
    </div>
    <div class="toggles">
      <label><input type="checkbox" data-t="ads" ${q.ads_price ? "checked" : ""}> Google Ads price ($99)</label>
      <label><input type="checkbox" data-t="business" ${q.business ? "checked" : ""}> Business account</label>
    </div>
    <div class="actions">
      <button class="btn primary" data-act="stella">Create quote in Stella</button>
      <button class="btn" data-act="reprice">Update price</button>
      ${laterMenu(c)}
      <span class="spacer"></span>
      <button class="btn quiet" data-act="skip">Skip</button>
    </div>`;
}

function laterMenu(c) {
  const open = state.openMenu === c.id;
  const leadItems = c.lead_id ? `
      <button role="menuitem" data-act="booked">They booked</button>
      <button role="menuitem" data-act="lost">Not interested</button>` : "";
  return `<span class="menu"><button class="btn" data-act="menu" aria-expanded="${open}" aria-haspopup="menu">More</button>${open ? `
    <span class="menu-list" role="menu">
      <button role="menuitem" data-act="snooze2">Remind me in 2 hours</button>
      <button role="menuitem" data-act="snoozeT">Remind me tomorrow 9 am</button>${leadItems}
    </span>` : ""}</span>`;
}

function tomorrowISO() { const d = new Date(Date.now() + 86400000); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function prettyPhone(e) { if (!e) return ""; const d = e.replace(/\D/g, "").slice(-10); return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`; }

// ---------- actions ----------
function wire() {
  app.querySelectorAll("article.item").forEach((el) => {
    const id = el.dataset.id;
    const ta = el.querySelector("[data-draft]");
    if (ta) {
      const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 4 + "px"; };
      fit();
      ta.oninput = () => { fit(); el.querySelector("[data-chars]").textContent = `${ta.value.length} characters`; };
    }
    el.querySelectorAll("[data-act]").forEach((btn) => btn.onclick = () => onAction(id, btn.dataset.act, el, btn));
  });
}

async function call(body) {
  try {
    return await gs("doAction", { ...body, actor: state.user }, pin_());
  } catch (e) {
    throw new Error(String(e.message || e).replace(/^Exception:\s*/, ""));
  }
}

async function onAction(id, act, el, btn) {
  if (act === "menu") { state.openMenu = state.openMenu === id ? null : id; render(); return; }
  state.openMenu = null;
  const draft = el.querySelector("[data-draft]")?.value;
  const btns = el.querySelectorAll("button"); btns.forEach((b) => b.disabled = true);
  try {
    if (act === "approve") {
      const r = await call({ card_id: id, action: "approve", draft });
      toast(r.scheduled_for ? `Saved. It goes out ${fmtWhen(r.scheduled_for)}.` : "Text sent.");
    } else if (act === "stella") {
      await call({ card_id: id, action: "reprice", ...priceFields(el) });
      const f = (n) => el.querySelector(`[data-f="${n}"]`)?.value || "";
      await call({ card_id: id, action: "approve", start_date: f("start_date"), email: f("email") });
      toast("Quote created in Stella. Send it from there.");
    } else if (act === "reprice") {
      await call({ card_id: id, action: "reprice", ...priceFields(el) });
      toast("Price updated.");
    } else if (act === "snooze2") {
      if (draft != null) await call({ card_id: id, action: "edit", draft });
      await call({ card_id: id, action: "snooze" }); toast("Moved to Later for 2 hours.");
    } else if (act === "snoozeT") {
      if (draft != null) await call({ card_id: id, action: "edit", draft });
      await call({ card_id: id, action: "snooze", preset: "tomorrow" }); toast("Moved to tomorrow at 9 am.");
    } else if (act === "skip") {
      const reason = prompt("Why skip this one? (optional, helps improve the drafts)") ?? null;
      await call({ card_id: id, action: "skip", reason }); toast("Skipped.");
    } else if (act === "booked" || act === "lost") {
      await call({ card_id: id, action: "lead_status", status: act });
      toast(act === "booked" ? "Marked booked. Follow-ups stopped." : "Marked lost. Follow-ups stopped.");
    } else if (act === "done") {
      await call({ card_id: id, action: "done" }); toast("Marked done.");
    }
  } catch (e) {
    toast(e.message);
  }
  await load();
}

function priceFields(el) {
  const v = (f) => el.querySelector(`[data-f="${f}"]`)?.value ?? "";
  const t = (f) => !!el.querySelector(`[data-t="${f}"]`)?.checked;
  const card = state.cards.find((c) => c.id === el.dataset.id);
  const q = card?.payload?.quote || {};
  const ads = t("ads"), business = t("business");
  // Only send typed overrides if they differ from what the rules produced.
  const changed = (f) => v(f) !== "" && Number(v(f)) !== Number(q[f]);
  const togglesChanged = ads !== !!q.ads_price || business !== !!q.business;
  const override = !togglesChanged && (changed("rent") || changed("delivery") || changed("pickup"))
    ? { rent: v("rent"), delivery: v("delivery"), pickup: v("pickup") } : null;
  return { ads, business, override };
}

function pin_() { return store.get("velox-pin") || ""; }
function signin(msg) {
  app.innerHTML = `<div class="signin"><span class="mark"></span><h1>Velox checklist</h1><p>${esc(msg || "Enter your PIN.")}</p><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN"><button class="btn primary" id="go">Sign in</button></div>`;
  const go = async () => {
    const val = document.getElementById("pin").value.trim();
    if (!val) return;
    try {
      const name = await gs("checkPin", val);
      store.set("velox-pin", val); store.set("velox-actor", name); state.user = name;
      boot();
    } catch (e) { signin(String(e.message || e)); }
  };
  document.getElementById("go").onclick = go;
  document.getElementById("pin").onkeydown = (e) => { if (e.key === "Enter") go(); };
  document.getElementById("pin").focus();
}

pin_() ? boot() : signin();
</script>
</body>
</html>
